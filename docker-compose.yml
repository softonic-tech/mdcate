# =============================================================================
# medprep.study — Docker Compose (EC2 + domain via nginx)
# =============================================================================
#
# DNS (example medprep.study):
#   A     @      → EC2 public IP
#   A     www    → EC2 public IP   (or CNAME www → medprep.study)
#   CNAME api    → medprep.study
#   CNAME admin  → medprep.study
#
# Security group: TCP 80, 443 (close 3000/4000/5000 after nginx is live)
#
# Quick start:
#   1. cp .env.docker.example .env  → set domain URLs + secrets
#   2. docker compose up -d --build
#   3. ./deploy/setup-ssl.sh admin@medprep.study
#   4. docker compose exec backend node scripts/seed.js --clear  (first deploy)
#
# URLs (after SSL):
#   https://medprep.study
#   https://admin.medprep.study
#   https://api.medprep.study/api/v1
# =============================================================================

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - medprep
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-medprep}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - medprep
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/medprep-study
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-medprep}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      FRONTEND_URL: ${FRONTEND_URL}
      ADMINPANEL_URL: ${ADMINPANEL_URL}
      BACKEND_URL: ${BACKEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OAUTH_REDIRECT_URI: ${BACKEND_URL}/api/v1/auth/google/callback
      FACEBOOK_REDIRECT_URI: ${BACKEND_URL}/api/v1/auth/facebook/callback
      NOTES_UPLOAD_DIR: /app/uploads/notes
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - medprep
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medprep

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PORT: 4000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medprep

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - admin
      - backend
    networks:
      - medprep

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    profiles:
      - certbot

networks:
  medprep:
    driver: bridge

volumes:
  mongo_data:
  rabbitmq_data:
  backend_uploads:
